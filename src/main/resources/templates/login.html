
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSit | Iniciar Sesión</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-base: #f8fafc;
        --bg-surface: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --brand-primary: #2563eb;
        --brand-primary-hover: #1d4ed8;
        --danger: #ef4444;
        --danger-light: #fef2f2;
        --success: #10b981;
        --success-light: #ecfdf5;
        --radius-md: 8px;
        --radius-lg: 12px;
        --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body {
        background-color: var(--bg-base);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
    }
    .login-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: 40px;
        width: 100%;
        max-width: 380px;
    }
    .login-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 8px;
    }
    .login-brand i { color: var(--brand-primary); font-size: 22px; }
    .login-brand span { font-size: 20px; font-weight: 700; }
    .login-subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 13px;
        margin-bottom: 28px;
    }
    .form-field { margin-bottom: 18px; }
    .form-field label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
    }
    .form-field input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 14px;
    }
    .form-field input:focus {
        outline: none;
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .btn-login {
        width: 100%;
        padding: 11px;
        background: var(--brand-primary);
        color: #fff;
        border: none;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-login:hover { background: var(--brand-primary-hover); }
    .alert {
        padding: 10px 14px;
        border-radius: var(--radius-md);
        font-size: 13px;
        margin-bottom: 18px;
    }
    .alert-error { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); }
    .alert-success { background: var(--success-light); color: #047857; border: 1px solid var(--success); }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-brand">
        <i class="fas fa-shield-halved"></i>
        <span>NetSit</span>
    </div>
    <p class="login-subtitle">Panel de Administración de Red</p>

    <div th:if="${param.error}" class="alert alert-error">
        <i class="fas fa-circle-exclamation"></i> Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> Sesión cerrada correctamente.
    </div>

    <form method="post" action="/login">
        <div class="form-field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="form-field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-right-to-bracket"></i> Iniciar Sesión
        </button>
    </form>
</div>

</body>
</html>
