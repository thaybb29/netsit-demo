name: CI Pipeline Spring Boot

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build con Maven
        run: mvn -B clean compile

      - name: Ejecutar tests
        env:
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
          ASTERISK_AMI_PASSWORD: ${{ secrets.ASTERISK_AMI_PASSWORD }}
        run: mvn -B test

      - name: Reporte de cobertura JaCoCo
        run: mvn jacoco:report

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco

      - name: Verificar variable de entorno
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}
        run: echo "Ejecutando en el ambiente configurado"